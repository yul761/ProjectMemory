<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StateCore</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', monospace;
    background: #0d1117;
    color: #c9d1d9;
    padding: 12px;
    font-size: 12px;
    user-select: none;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    border-bottom: 1px solid #21262d;
    padding-bottom: 8px;
  }
  .title { font-weight: 700; font-size: 13px; color: #58a6ff; letter-spacing: 0.5px; }
  .refresh-time { color: #484f58; font-size: 10px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid #161b22;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #8b949e; }
  .value { font-weight: 600; }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .green { background: #3fb950; box-shadow: 0 0 4px #3fb95080; }
  .red { background: #f85149; }
  .yellow { background: #d29922; }
  .gray { background: #484f58; }
  .scope-select {
    background: #161b22;
    border: 1px solid #30363d;
    color: #c9d1d9;
    font-size: 11px;
    padding: 2px 4px;
    border-radius: 4px;
    max-width: 160px;
    cursor: pointer;
  }
  .section {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #21262d;
  }
  .section-title { color: #484f58; font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .events-today { font-size: 20px; font-weight: 700; color: #58a6ff; }
  .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .mini-card { background: #161b22; border-radius: 6px; padding: 6px 8px; }
  .mini-val { font-size: 16px; font-weight: 700; color: #e6edf3; }
  .mini-label { font-size: 10px; color: #484f58; margin-top: 1px; }
</style>
</head>
<body>

<div class="header">
  <span class="title">⚡ StateCore</span>
  <span class="refresh-time" id="last-refresh">—</span>
</div>

<div class="row">
  <span class="label">API</span>
  <span class="value" id="api-status"><span class="dot gray"></span>—</span>
</div>

<div class="row">
  <span class="label">Scope</span>
  <select class="scope-select" id="scope-select" onchange="onScopeChange()">
    <option value="">loading...</option>
  </select>
</div>

<div class="section">
  <div class="section-title">Memory Layers</div>

  <div class="row">
    <span class="label">Working Memory</span>
    <span class="value" id="wm-version">—</span>
  </div>
  <div class="row">
    <span class="label">State Layer</span>
    <span class="value" id="state-version">—</span>
  </div>
  <div class="row">
    <span class="label">Digest Age</span>
    <span class="value" id="digest-age">—</span>
  </div>
  <div class="row">
    <span class="label">Goal</span>
    <span class="value" id="current-goal" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:#8b949e">—</span>
  </div>
  <div class="row">
    <span class="label">Last Event</span>
    <span class="value" id="last-event">—</span>
  </div>
</div>

<div class="section">
  <div class="mini-grid">
    <div class="mini-card">
      <div class="mini-val" id="events-today">—</div>
      <div class="mini-label">events today</div>
    </div>
    <div class="mini-card">
      <div class="mini-val" id="wm-items">—</div>
      <div class="mini-label">WM items</div>
    </div>
    <div class="mini-card">
      <div class="mini-val" id="undigested">—</div>
      <div class="mini-label">undigested</div>
    </div>
    <div class="mini-card">
      <div class="mini-val" id="queue-active">—</div>
      <div class="mini-label">jobs active</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">MCP Today</div>
  <div class="mini-grid">
    <div class="mini-card">
      <div class="mini-val" id="mcp-save">—</div>
      <div class="mini-label">save_turn</div>
    </div>
    <div class="mini-card">
      <div class="mini-val" id="mcp-recall">—</div>
      <div class="mini-label">recall</div>
    </div>
    <div class="mini-card">
      <div class="mini-val" id="mcp-context">—</div>
      <div class="mini-label">get_context</div>
    </div>
    <div class="mini-card">
      <div class="mini-val" id="mcp-digest">—</div>
      <div class="mini-label">force_digest</div>
    </div>
  </div>
</div>

<div class="section" id="warnings-section" style="display:none">
  <div class="section-title">Warnings</div>
  <div id="warnings-list" style="font-size:10px;color:#d29922;line-height:1.6"></div>
</div>

<script>
const API = 'http://localhost:3002';
const TOKEN = 'local-dev-user';

let currentScopeId = null;
let scopeGoals = {};

function headers() {
  return { 'x-user-id': TOKEN };
}

async function get(path) {
  const r = await fetch(API + path, { headers: headers() });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function dot(color) {
  return `<span class="dot ${color}"></span>`;
}

function timeAgo(isoStr) {
  if (!isoStr) return '—';
  const diff = Date.now() - new Date(isoStr).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

function onScopeChange() {
  const sel = document.getElementById('scope-select');
  currentScopeId = sel.value || null;
  refreshScope();
}

async function refreshStatus() {
  // API health — use /scopes (requires auth header, proves API + DB both up)
  try {
    await get('/scopes');
    document.getElementById('api-status').innerHTML = dot('green') + 'running';
  } catch {
    document.getElementById('api-status').innerHTML = dot('red') + 'offline';
    document.getElementById('wm-version').textContent = '—';
    document.getElementById('state-version').textContent = '—';
    document.getElementById('last-event').textContent = '—';
    document.getElementById('events-today').textContent = '—';
    document.getElementById('wm-items').textContent = '—';
    return;
  }

  // Scopes
  try {
    const data = await get('/scopes');
    const scopes = data.items || [];
    const sel = document.getElementById('scope-select');
    const prev = currentScopeId;
    scopeGoals = Object.fromEntries(scopes.map(s => [s.id, s.goal]));
    sel.innerHTML = scopes.length
      ? scopes.map(s => `<option value="${s.id}">${s.name}</option>`).join('')
      : '<option value="">no scopes</option>';
    if (prev && scopes.find(s => s.id === prev)) {
      sel.value = prev;
    } else if (scopes.length) {
      currentScopeId = scopes[0].id;
      sel.value = currentScopeId;
    }
  } catch {}

  await refreshScope();

  document.getElementById('last-refresh').textContent =
    new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function refreshScope() {
  if (!currentScopeId) return;

  // Working memory
  try {
    const wm = await get(`/memory/working-state?scopeId=${currentScopeId}`);
    document.getElementById('wm-version').innerHTML =
      wm.version ? dot('green') + `v${wm.version}` : dot('gray') + 'empty';

    // Count WM items
    let items = 0;
    if (wm.state) {
      const s = wm.state;
      items += (s.decisions?.length || 0) + (s.constraints?.length || 0) + (s.todos?.length || 0);
    }
    document.getElementById('wm-items').textContent = items || '—';
  } catch {
    document.getElementById('wm-version').innerHTML = dot('gray') + '—';
  }

  // Stable state + digest age + goal
  let digestCreatedAt = null;
  try {
    const state = await get(`/memory/stable-state?scopeId=${currentScopeId}`);
    document.getElementById('state-version').innerHTML =
      state.digestId ? dot('green') + `digest` : dot('gray') + 'no digest';
    digestCreatedAt = state.createdAt ?? null;
    document.getElementById('digest-age').textContent =
      digestCreatedAt ? timeAgo(digestCreatedAt) : '—';
    const goal = state.view?.goal ?? scopeGoals[currentScopeId] ?? null;
    document.getElementById('current-goal').textContent = goal ?? '—';
    document.getElementById('current-goal').title = goal ?? '';
  } catch {
    document.getElementById('state-version').innerHTML = dot('gray') + '—';
    document.getElementById('digest-age').textContent = '—';
    document.getElementById('current-goal').textContent = '—';
  }

  // Recent events + undigested count
  try {
    const evts = await get(`/memory/events?scopeId=${currentScopeId}&limit=200`);
    const items = evts.items || [];
    const latest = items[0];
    document.getElementById('last-event').textContent =
      latest ? timeAgo(latest.createdAt) : 'none';

    const today = new Date().toDateString();
    const todayCount = items.filter(e =>
      new Date(e.createdAt).toDateString() === today
    ).length;
    document.getElementById('events-today').textContent = todayCount;

    const undigested = digestCreatedAt
      ? items.filter(e => new Date(e.createdAt) > new Date(digestCreatedAt)).length
      : items.length;
    document.getElementById('undigested').textContent = undigested || '0';
  } catch {}

  // Warnings
  try {
    const layer = await get(`/memory/layer-status?scopeId=${currentScopeId}`);
    const warnings = layer.warnings || [];
    const sec = document.getElementById('warnings-section');
    const list = document.getElementById('warnings-list');
    if (warnings.length) {
      sec.style.display = '';
      list.innerHTML = warnings.map(w => `⚠ ${w}`).join('<br>');
    } else {
      sec.style.display = 'none';
    }
  } catch {}

  // Queue jobs
  try {
    const q = await get('/diagnostics/queues');
    const active = (q.digest.active || 0) + (q.workingMemory.active || 0);
    const waiting = (q.digest.waiting || 0) + (q.workingMemory.waiting || 0);
    const failed = (q.digest.failed || 0) + (q.workingMemory.failed || 0);
    let val = String(active);
    if (waiting > 0) val += `+${waiting}w`;
    const el = document.getElementById('queue-active');
    el.textContent = val;
    el.style.color = failed > 0 ? '#f85149' : active > 0 ? '#3fb950' : '#e6edf3';
    if (failed > 0) el.textContent += ` ${failed}f`;
  } catch {
    document.getElementById('queue-active').textContent = '—';
  }

  // MCP usage today
  try {
    const mcp = await get('/diagnostics/mcp-usage');
    const c = mcp.counts || {};
    document.getElementById('mcp-save').textContent = c['save_turn'] ?? '0';
    document.getElementById('mcp-recall').textContent = c['recall'] ?? '0';
    document.getElementById('mcp-context').textContent = c['get_context'] ?? '0';
    document.getElementById('mcp-digest').textContent = c['force_digest'] ?? '0';
  } catch {}
}

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
