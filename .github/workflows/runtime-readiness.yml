name: Runtime Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

jobs:
  runtime-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # `secrets` is not a valid context in a job-level `if` — GitHub rejects the
    # whole workflow file, which is why this showed up as an instant 0-second
    # "workflow file issue" failure on every push, red on the commit list without
    # ever running a step. The key check moved into the first step instead, where
    # `secrets` is allowed; the job then no-ops loudly rather than failing.
    services:
      postgres:
        # pgvector, not stock postgres: 20260615020000_pgvector_embeddings runs
        # `CREATE EXTENSION vector`, and every script this workflow calls runs
        # `db:deploy`. Stock postgres:16 fails there with `extension "vector" is
        # not available`, as ci.yml did until it was moved to this image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statecore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      API_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/statecore
      REDIS_URL: redis://localhost:6379
      FEATURE_LLM: "true"
      WORKING_MEMORY_ENABLED: "true"
      WORKING_MEMORY_USE_LLM: "false"
      MODEL_PROVIDER: openai-compatible
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY != '' && secrets.MODEL_API_KEY || secrets.OPENAI_API_KEY }}
      MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL || 'https://api.openai.com/v1' }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'gpt-5-nano' }}
      MODEL_CHAT_NAME: ${{ vars.MODEL_CHAT_NAME || 'gpt-5-nano' }}
      MODEL_RUNTIME_NAME: ${{ vars.MODEL_RUNTIME_NAME || 'gpt-5-nano' }}
      MODEL_RUNTIME_BASE_URL: ${{ vars.MODEL_RUNTIME_BASE_URL || 'https://api.openai.com/v1' }}
      MODEL_RUNTIME_REASONING_EFFORT: low
      MODEL_RUNTIME_MAX_OUTPUT_TOKENS: 400
      MODEL_STRUCTURED_OUTPUT_NAME: ${{ vars.MODEL_STRUCTURED_OUTPUT_NAME || 'gpt-5-nano' }}
      MODEL_STRUCTURED_OUTPUT_REASONING_EFFORT: low
      MODEL_STRUCTURED_OUTPUT_MAX_OUTPUT_TOKENS: 600
      LOG_LEVEL: info

    steps:
      - name: Check for a model API key
        id: gate
        run: |
          if [ -n "${{ secrets.MODEL_API_KEY }}" ] || [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MODEL_API_KEY or OPENAI_API_KEY configured — skipping the LLM run."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Both generated Prisma clients must exist before a repo-wide build:
      # packages/db needs the full client, apps/mcp's dts build needs the
      # lite client (missing either fails `pnpm build`).
      - name: Generate Prisma client
        if: steps.gate.outputs.present == 'true'
        run: pnpm db:generate

      - name: Generate Prisma lite client
        if: steps.gate.outputs.present == 'true'
        run: pnpm db:generate:lite

      - name: Build workspace
        if: steps.gate.outputs.present == 'true'
        run: pnpm build

      - name: Run runtime readiness
        if: steps.gate.outputs.present == 'true'
        run: ./scripts/ci/runtime-readiness.sh

      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-readiness
          path: |
            runtime-doctor.json
            runtime-benchmark.json
            runtime-drift.json
            runtime-readiness-summary.json
            runtime-readiness-summary.md
            .tmp-api.log
            .tmp-worker.log
          if-no-files-found: warn
