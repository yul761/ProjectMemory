name: Integration Smoke

on:
  # Work lands on this repository by pushing to main, so a pull_request-only
  # trigger meant this workflow last ran on 2026-06-20 — failing, on a branch,
  # while the README badge reported that result for the two months since.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-no-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # pgvector, not stock postgres: 20260615020000_pgvector_embeddings runs
        # `CREATE EXTENSION vector`, and every script this workflow calls runs
        # `db:deploy`. Stock postgres:16 fails there with `extension "vector" is
        # not available`, as ci.yml did until it was moved to this image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statecore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      API_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/statecore
      REDIS_URL: redis://localhost:6379
      FEATURE_LLM: "false"
      LOG_LEVEL: info

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace
        run: pnpm build

      - name: Run integration smoke
        run: ./scripts/ci/integration-no-llm.sh
