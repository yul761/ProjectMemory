name: Release Plan

on:
  workflow_dispatch:

jobs:
  release-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # apps/mcp's dts build needs the lite client or `pnpm build` fails
      # with TS7006 (see integration-smoke.yml).
      - name: Generate Prisma lite client
        run: pnpm db:generate:lite

      - name: Build workspace
        run: pnpm build

      - name: Show changeset status
        run: pnpm release:status
