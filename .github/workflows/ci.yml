name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, not stock postgres: 20260615020000_pgvector_embeddings runs
        # `CREATE EXTENSION vector`, so migrate deploy died here on every run
        # with `extension "vector" is not available`. Local (docker-compose.local)
        # and both droplets already use this image; CI was the only one that
        # didn't, which is exactly the environment nobody was looking at.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: statecore
          POSTGRES_PASSWORD: statecore
          POSTGRES_DB: statecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://statecore:statecore@localhost:5432/statecore_test
      # apps/api's integration tests read DATABASE_URL_TEST and fall back to a
      # local-dev default on port 5434 — a port nothing listens on in CI. Without
      # this they would connect nowhere while `migrate deploy` above happily
      # prepared the database they were meant to use.
      DATABASE_URL_TEST: postgresql://statecore:statecore@localhost:5432/statecore_test
      REDIS_URL: redis://localhost:6379
      # Matches the local .env. Endpoints behind this flag reject with 400 before
      # they ever check scope ownership, so with it off the multi-tenant digest
      # case passes for the wrong reason — "feature disabled" rather than "not
      # your scope" — and stops testing isolation at all. Nothing here calls a
      # model: digest only enqueues, and no worker runs in the test process.
      FEATURE_LLM: "true"
      # With FEATURE_LLM on, env.ts demands an API key — but only when the base
      # URL is api.openai.com. Pointing at a dead local port satisfies it without
      # a placeholder key, and is the safer of the two: a fake key against the
      # real host would let a stray test actually reach OpenAI and get a 401,
      # whereas this guarantees CI makes no outbound model calls at all. Any test
      # that tried would fail loudly on connection refused, which is what we want
      # to hear about.
      MODEL_BASE_URL: http://127.0.0.1:9/v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `migrate deploy` applies SQL; it does not generate the client. Every other
      # workflow in this repo had this step and CI did not, so the worker suite
      # died on "@prisma/client did not initialize yet" the moment CI got far
      # enough to run it.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm --filter @statecore/db exec prisma migrate deploy

      - name: Run core tests
        run: pnpm --filter @statecore/core test

      - name: Run worker tests
        run: pnpm --filter @statecore/worker test

      - name: Run API tests
        run: pnpm --filter @statecore/api test

      - name: Type check
        run: pnpm --filter @statecore/core exec tsc --noEmit
