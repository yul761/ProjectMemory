name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statecore_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/statecore_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5434/statecore_test
      REDIS_URL: redis://localhost:6380
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm --filter @statecore/db exec prisma migrate deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint (TypeScript strict check)
        run: pnpm lint

      - name: Build workspace
        run: pnpm -r --filter "./apps/**" --filter "./packages/**" build

      - name: Run core tests
        run: pnpm --filter @statecore/core test

      - name: Run worker tests
        run: pnpm --filter @statecore/worker test

      - name: Run API tests
        run: pnpm --filter @statecore/api test

      - name: Type check
        run: pnpm --filter @statecore/core exec tsc --noEmit
