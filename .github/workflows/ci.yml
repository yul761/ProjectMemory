name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: statecore
          POSTGRES_PASSWORD: statecore
          POSTGRES_DB: statecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://statecore:statecore@localhost:5432/statecore_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @statecore/db exec prisma migrate deploy

      - name: Run core tests
        run: pnpm --filter @statecore/core test

      - name: Run worker tests
        run: pnpm --filter @statecore/worker test

      - name: Run API tests
        run: pnpm --filter @statecore/api test

      - name: Type check
        run: pnpm --filter @statecore/core exec tsc --noEmit
